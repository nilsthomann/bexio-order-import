name: Build & Test (PR)

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies (incl. local tools)
        run: dotnet tool restore && dotnet restore BexioOrderImport.slnx

      - name: Build solution
        run: dotnet build BexioOrderImport.slnx -c Release --no-restore

      - name: Run unit tests & generate coverage
        working-directory: build
        run: powershell -ExecutionPolicy Bypass -File run-coverage.ps1 -Configuration Release -CI

      - name: Publish Coverage to GitHub Run Summary
        run: |
          Get-Content -Path TestResults/CoverageReport/Summary.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        shell: powershell

      - name: Report Test Results & Coverage to PR
        uses: bibipkins/dotnet-test-reporter@v1.6.4
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-title: '🧪 Unit Test & Code Coverage Report'
          results-path: 'TestResults/*.trx'
          coverage-path: 'TestResults/coverage.cobertura.xml'
          coverage-type: 'cobertura'
          coverage-threshold: 90

